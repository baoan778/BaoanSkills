<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">BaoanSkills</title>
  <desc id="desc">39 provenance-verified CTF and authorized security skills for Codex-compatible agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1b2d"/>
      <stop offset="1" stop-color="#102b45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e8c4"/>
      <stop offset="0.55" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d57"/>
      <stop offset="1" stop-color="#0d2338"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-width="0.75" opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="1190" cy="26" r="180" fill="#38e8c4" opacity="0.055"/>
  <circle cx="40" cy="330" r="210" fill="#58a6ff" opacity="0.07"/>
  <path d="M0 304C184 250 336 326 510 278C732 216 880 292 1280 218V340H0Z" fill="#06101c" opacity="0.62"/>

  <g transform="translate(72 78)">
    <rect width="96" height="96" rx="26" fill="url(#logo)" stroke="url(#accent)" stroke-width="2"/>
    <path d="M25 31L47 50L25 69" fill="none" stroke="#38e8c4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M51 69H73" fill="none" stroke="#f4b860" stroke-width="7" stroke-linecap="round"/>
    <circle cx="73" cy="26" r="5" fill="#58a6ff" filter="url(#glow)"/>
  </g>

  <text x="198" y="119" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5">BaoanSkills</text>
