  <rect x="202" y="180" width="548" height="2" rx="1" fill="url(#accent)" opacity="0.9"/>
  <text x="202" y="220" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">39 provenance-verified skills for Codex-compatible agents.</text>
  <text x="202" y="250" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Focused workflows. On-demand references. Explicit guardrails.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="202" y="274" width="66" height="30" rx="15" fill="#102f43" stroke="#24516b"/>
    <text x="235" y="294" text-anchor="middle" fill="#7dd3fc">CTF</text>
    <rect x="278" y="274" width="98" height="30" rx="15" fill="#102f43" stroke="#24516b"/>
    <text x="327" y="294" text-anchor="middle" fill="#7dd3fc">APPSEC</text>
    <rect x="386" y="274" width="90" height="30" rx="15" fill="#102f43" stroke="#24516b"/>
    <text x="431" y="294" text-anchor="middle" fill="#7dd3fc">INFRA</text>
    <rect x="486" y="274" width="94" height="30" rx="15" fill="#102f43" stroke="#24516b"/>
    <text x="533" y="294" text-anchor="middle" fill="#7dd3fc">AUDIT</text>
  </g>

  <g transform="translate(842 62)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="366" height="216" rx="20" fill="#071421" fill-opacity="0.9" stroke="#2d5b78"/>
    <rect x="0" y="0" width="366" height="42" rx="20" fill="#0d263b"/>
    <rect x="0" y="20" width="366" height="22" fill="#0d263b"/>
    <circle cx="24" cy="21" r="5.5" fill="#f87171"/>
    <circle cx="43" cy="21" r="5.5" fill="#fbbf24"/>
    <circle cx="62" cy="21" r="5.5" fill="#34d399"/>
    <text x="86" y="26" fill="#7f9db4" font-size="13">baoan778/BaoanSkills</text>

    <text x="24" y="77" fill="#8be9d3" font-size="15" font-weight="700">skills/</text>
    <path d="M31 94V199" stroke="#33566f" stroke-width="1.5"/>
    <text x="48" y="102" fill="#cbd5e1" font-size="15">solve-challenge</text>
    <text x="48" y="128" fill="#cbd5e1" font-size="15">ctf-web · ctf-crypto · ctf-pwn</text>
    <text x="48" y="154" fill="#cbd5e1" font-size="15">appsec · cloud · audit</text>
    <text x="48" y="180" fill="#f4b860" font-size="15">39 focused playbooks</text>
    <rect x="236" y="168" width="104" height="30" rx="15" fill="#123a3a" stroke="#2a6b62"/>
    <text x="288" y="188" text-anchor="middle" fill="#8be9d3" font-size="13" font-weight="700">HASH-LOCKED</text>
