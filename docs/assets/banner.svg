<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">BaoanSkills</title>
  <desc id="desc">39 provenance-verified CTF and authorized security skills for Codex-compatible agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0a1b2d"/>
      <stop offset="1" stop-color="#102b45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e8c4"/>
      <stop offset="0.55" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d57"/>
      <stop offset="1" stop-color="#0d2338"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-width="0.7" opacity="0.15"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#grid)"/>
  <circle cx="1110" cy="20" r="205" fill="#38e8c4" opacity="0.06"/>
  <circle cx="32" cy="300" r="220" fill="#58a6ff" opacity="0.07"/>
  <path d="M0 278C210 222 360 300 552 250C760 196 935 270 1200 194V300H0Z" fill="#06101c" opacity="0.58"/>

  <g transform="translate(64 66)">
    <rect width="96" height="96" rx="26" fill="url(#logo)" stroke="url(#accent)" stroke-width="2"/>
    <path d="M25 31L47 50L25 69" fill="none" stroke="#38e8c4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M51 69H73" fill="none" stroke="#f4b860" stroke-width="7" stroke-linecap="round"/>
    <circle cx="73" cy="26" r="5" fill="#58a6ff" filter="url(#glow)"/>
  </g>

  <text x="186" y="111" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-2">BaoanSkills</text>
  <text x="190" y="151" fill="#c7d2fe" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400">39 provenance-verified skills for coding agents.</text>
  <text x="190" y="183" fill="#8be9d3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3.4">FOCUSED WORKFLOWS · EXPLICIT GUARDRAILS</text>
  <rect x="190" y="205" width="470" height="2" rx="1" fill="url(#accent)" opacity="0.9"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="190" y="225" width="66" height="30" rx="15" fill="#102f43" stroke="#24516b"/>
    <text x="223" y="245" text-anchor="middle" fill="#7dd3fc">CTF</text>
    <rect x="266" y="225" width="98" height="30" rx="15" fill="#102f43" stroke="#24516b"/>
    <text x="315" y="245" text-anchor="middle" fill="#7dd3fc">APPSEC</text>
    <rect x="374" y="225" width="90" height="30" rx="15" fill="#102f43" stroke="#24516b"/>
    <text x="419" y="245" text-anchor="middle" fill="#7dd3fc">INFRA</text>
    <rect x="474" y="225" width="94" height="30" rx="15" fill="#102f43" stroke="#24516b"/>
    <text x="521" y="245" text-anchor="middle" fill="#7dd3fc">AUDIT</text>
  </g>

  <g transform="translate(746 46)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="390" height="208" rx="22" fill="#071421" fill-opacity="0.92" stroke="#2d5b78"/>
    <text x="30" y="96" fill="#f8fafc" font-size="78" font-weight="800">39</text>
    <text x="145" y="70" fill="#8be9d3" font-size="18" font-weight="700" letter-spacing="2.2">SECURITY SKILLS</text>
    <text x="145" y="98" fill="#94a3b8" font-size="17">provenance-verified</text>
    <rect x="30" y="128" width="330" height="1" fill="#2d5b78" opacity="0.8"/>
    <text x="30" y="164" fill="#dbeafe" font-size="18" font-weight="700">SHA-256 LOCKED</text>
    <text x="30" y="188" fill="#94a3b8" font-size="16">fail-closed installs</text>
    <rect x="236" y="139" width="124" height="34" rx="17" fill="#123a3a" stroke="#2a6b62"/>
    <text x="298" y="161" text-anchor="middle" fill="#8be9d3" font-size="14" font-weight="700">MIT + CC BY-SA</text>
  </g>
</svg>
