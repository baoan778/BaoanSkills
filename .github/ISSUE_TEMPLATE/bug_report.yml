name: Bug report
description: Report a validation, routing, or documentation problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include live credentials, private target data, or unpatched vulnerability details.
  - type: input
    id: skill
    attributes:
      label: Affected skill or file
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      render: shell
