name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Lint Python sources
        run: python -m ruff check scripts tests

      - name: Run tests
        run: python -m pytest

      - name: Validate skill schema
        run: python scripts/validate_skills.py --strict

      - name: Check publication allowlist and lock
        run: python scripts/check_publication.py --check

      - name: Check whitespace and encoding
        run: |
          python scripts/check_whitespace.py
          python scripts/check_encoding.py

      - name: Check Markdown, links, and resources
        run: |
          python scripts/check_markdown_structure.py
          python scripts/check_links.py
          python scripts/check_resources.py

      - name: Check skill layout and reachability
        run: python scripts/check_skill_layout.py

      - name: Check reviewed quality metadata
        run: |
          python scripts/apply_skill_quality.py --check
          python scripts/generate_agent_metadata.py --check

      - name: Smoke test scripts
        run: python scripts/smoke_test_scripts.py

      - name: Check generated reports
        run: |
          python scripts/build_index.py --check
          python scripts/build_provenance.py --check
          python scripts/build_kb_manifest.py --check

      - name: Check GitHub workflow pinning
        run: python scripts/check_workflows.py

      - name: Check release readiness
        run: python scripts/check_release_readiness.py --strict

  public-bundle:
    name: Public snapshot
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build and validate snapshot
        run: python scripts/build_public_bundle.py --output "$RUNNER_TEMP/baoanskills-public" --force

      - name: Upload validated snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baoanskills-public
          path: ${{ runner.temp }}/baoanskills-public
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository with gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
