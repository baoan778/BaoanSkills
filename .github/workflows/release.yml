name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    if: github.repository == 'baoan778/BaoanSkills'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate semantic-version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or a valid prerelease suffix." >&2
            exit 1
          fi

      - name: Build validated public snapshot
        run: python scripts/build_public_bundle.py --output ../baoanskills-public --force

      - name: Package release payload
        run: python scripts/package_release.py --snapshot ../baoanskills-public --output-dir .

      - name: Smoke-test release archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          smoke_root="$RUNNER_TEMP/baoanskills-release-smoke"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root"
          unzip -q baoanskills-release.zip -d "$smoke_root"
          snapshot="$smoke_root/baoanskills-public"
          test -f "$snapshot/scripts/install_skills.py"
          python "$snapshot/scripts/install_skills.py" ctf-writeup --dest "$smoke_root/installed"
          test -f "$smoke_root/installed/ctf-writeup/SKILL.md"
          printf '\n# tampered after packaging\n' >> "$snapshot/skills/ctf-writeup/SKILL.md"
          if python "$snapshot/scripts/install_skills.py" ctf-writeup --dest "$smoke_root/tampered"; then
            echo "tampered source unexpectedly installed" >&2
            exit 1
          fi
          test ! -e "$smoke_root/tampered"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}
          path: |
            baoanskills-release.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            baoanskills-release.zip \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
